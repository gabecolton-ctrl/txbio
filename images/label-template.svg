<svg xmlns="http://www.w3.org/2000/svg" width="500" height="620" viewBox="0 0 500 620">
  <defs>
    <linearGradient id="labelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1917" />
      <stop offset="100%" style="stop-color:#070c0a" />
    </linearGradient>
    <linearGradient id="edgeShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5eead4;stop-opacity:0" />
      <stop offset="4%" style="stop-color:#5eead4;stop-opacity:0.5" />
      <stop offset="8%" style="stop-color:#5eead4;stop-opacity:0" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Label card with shadow -->
  <rect x="30" y="30" width="440" height="560" rx="14" fill="url(#labelBg)" filter="url(#softShadow)" />
  <rect x="30" y="30" width="440" height="560" rx="14" fill="none" stroke="#5eead4" stroke-width="1.5" opacity="0.5" />
  <rect x="30" y="30" width="10" height="560" fill="url(#edgeShine)" />

  <!-- Top brand header -->
  <g transform="translate(250, 100)">
    <circle cx="0" cy="-30" r="7" fill="#5eead4" />
    <circle cx="-28" cy="-10" r="7" fill="#5eead4" />
    <circle cx="28" cy="-10" r="6" fill="none" stroke="#5eead4" stroke-width="2" />
    <circle cx="-17" cy="25" r="6" fill="none" stroke="#5eead4" stroke-width="2" />
    <circle cx="17" cy="25" r="7" fill="#5eead4" />
    <line x1="0" y1="-30" x2="-28" y2="-10" stroke="#5eead4" stroke-width="1.6" />
    <line x1="0" y1="-30" x2="28" y2="-10" stroke="#5eead4" stroke-width="1.6" />
    <line x1="-28" y1="-10" x2="-17" y2="25" stroke="#5eead4" stroke-width="1.6" />
    <line x1="28" y1="-10" x2="17" y2="25" stroke="#5eead4" stroke-width="1.6" />
    <line x1="-17" y1="25" x2="17" y2="25" stroke="#5eead4" stroke-width="1.6" />
  </g>

  <text x="250" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#faf6ee" font-weight="bold">Texas Advanced</text>
  <text x="250" y="198" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#7c8f88" letter-spacing="3">BIORESEARCH</text>

  <line x1="90" y1="220" x2="410" y2="220" stroke="#5eead4" stroke-width="1" opacity="0.4" />

  <!-- Product name -->
  <text x="250" y="290" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="__NAME_FONT_SIZE__" fill="#ffffff" font-weight="700">__PRODUCT_NAME__</text>

  <!-- Dose -->
  <text x="250" y="322" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="__DOSE_FONT_SIZE__" fill="#5eead4" font-weight="600" letter-spacing="0.5">__PRODUCT_DOSE__</text>

  <line x1="90" y1="350" x2="410" y2="350" stroke="#232f2c" stroke-width="1" />

  <!-- Spec rows -->
  <text x="90" y="385" font-family="Segoe UI, sans-serif" font-size="12" fill="#7c8f88" letter-spacing="1">FORM</text>
  <text x="410" y="385" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="13" fill="#e4ece9" font-weight="600">__PRODUCT_FORM__</text>

  <text x="90" y="415" font-family="Segoe UI, sans-serif" font-size="12" fill="#7c8f88" letter-spacing="1">PURITY</text>
  <text x="410" y="415" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="13" fill="#e4ece9" font-weight="600">99% Pure</text>

  <line x1="90" y1="440" x2="410" y2="440" stroke="#232f2c" stroke-width="1" />

  <text x="250" y="475" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#7c8f88" letter-spacing="2">RESEARCH USE ONLY</text>

  <!-- Warning strip -->
  <rect x="60" y="500" width="380" height="42" rx="4" fill="#150a0a" stroke="#3a1512" stroke-width="1" />
  <text x="250" y="520" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#e5867a" font-weight="bold" letter-spacing="0.6">NOT FOR HUMAN OR ANIMAL USE</text>
  <text x="250" y="535" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#b3695f" letter-spacing="0.4">LABORATORY RESEARCH ONLY</text>

  <text x="250" y="570" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#5f6f68" letter-spacing="0.5">Dallas, TX · txbioresearch.com</text>
</svg>
