# Publishes the budget store. Lives in the budget site's own repo as
# .github/workflows/publish.yml (copied from txbio/budget/publish.yml).
# Builds from the public txbio repo with tools/build-budget.py and deploys to
# GitHub Pages. Runs every 30 minutes (skips when txbio hasn't changed) and
# from Actions → Publish → Run workflow.
name: Publish
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gabecolton-ctrl/txbio
          path: src
      - id: sha
        run: echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: seen
        uses: actions/cache@v4
        with:
          path: .built
          key: built-${{ steps.sha.outputs.sha }}
      - if: steps.seen.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python3 src/tools/build-budget.py site
          mkdir -p .built && echo "${{ steps.sha.outputs.sha }}" > .built/sha
      - if: steps.seen.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.seen.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        id: deploy
        uses: actions/deploy-pages@v4
